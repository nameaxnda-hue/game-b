<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมวางแผนชีวิต</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#091321;--fg:#f3f0e8;--card:#122239;--mut:#aab6c8;--bd:#2c4058;--ac:#d8b56a;--acf:#111c2b;--gain:#43c59e;--loss:#ff6f70;--pro:#a99cff;--inv:#e3bd70;--mov:#9aa9bc;--gold:#d8b56a;--navy:#091321;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#213754 0%,var(--bg) 58%);color:var(--fg);font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;line-height:1.45;font-variant-numeric:tabular-nums}
#app{max-width:1240px;margin:0 auto;padding:clamp(10px,2vw,22px)}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em;margin:.1em 0}
h2{font-size:1.3rem;font-weight:600;margin:.2em 0}h3{font-size:1.1rem;font-weight:600;margin:.2em 0}
button{font:inherit;border:1px solid #f0d99b66;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#f0d99b,#bd9347);color:#101a29;font-weight:700;cursor:pointer;margin:4px 6px 4px 0;box-shadow:0 6px 18px #0003,inset 0 1px #fff8;transition:transform .16s,filter .16s,box-shadow .16s}button:hover{filter:brightness(1.07);box-shadow:0 8px 22px #0005,inset 0 1px #fff9}
button:active{transform:scale(.97)}
button.g{background:linear-gradient(135deg,#1c304a,#14243a);color:var(--fg);border:1px solid #536984;box-shadow:0 4px 12px #0002}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);width:100%;margin:8px 0}
.card{background:linear-gradient(145deg,#162943ef,#101d30f7);border:1px solid #3a506b;border-radius:17px;padding:15px;margin:9px 0;box-shadow:0 12px 28px #0002,inset 0 1px #ffffff08;backdrop-filter:blur(8px)}
.lv0{border-color:var(--gain)}.lv1{border-color:#d9a400}.lv2{border-color:#ef7d00}
.lv3{border-color:var(--loss);animation:pl 1.1s infinite}
.out{opacity:.5;filter:grayscale(1)}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 #d6453d66}50%{box-shadow:0 0 18px 3px #d6453dcc}}
.big{font-size:2.1rem;font-weight:700;letter-spacing:-.02em;color:#f1d48e;text-shadow:0 2px 18px #d8b56a22}
.mut{color:var(--mut);font-size:1rem}
.lg{font-size:1.05em;margin:4px 0}
.mk{color:#fff;border-radius:8px;padding:6px 10px;font-weight:600;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:1.15rem}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:2px 9px;margin:2px 4px 2px 0;font-size:1rem;background:var(--bg)}
.wrap{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px;aspect-ratio:1;width:100%;padding:10px;background:linear-gradient(145deg,#1c3049,#0b1728);border:1px solid #b9985c;border-radius:22px;box-shadow:0 18px 42px #0005,inset 0 0 0 4px #d8b56a10,inset 0 0 32px #d8b56a0b}
.t{border-radius:10px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 24%,#15243a),color-mix(in srgb,var(--c) 8%,#0b1728));border:1px solid color-mix(in srgb,var(--c) 58%,#8c9bb0);color:#e5e9f0;font-size:clamp(.55rem,1.55vw,.88rem);font-weight:600;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;position:relative;min-width:0;box-shadow:inset 0 1px #ffffff10,0 2px 4px #0002}
.t svg{width:clamp(14px,3.4vw,26px);height:clamp(14px,3.4vw,26px);color:var(--c)}
.t.start{--c:var(--ac)}.t.luck{--c:var(--gain)}.t.bad,.t.accident,.t.illness{--c:var(--loss)}.t.skip,.t.back{--c:var(--mov)}.t.invest{--c:var(--inv)}.t.insure{--c:var(--pro)}
.pw{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;pointer-events:none}
.pw span{width:1.75em;height:1.75em;margin:-3px;border-radius:50%;color:#fff;border:2px solid var(--card);font-size:clamp(.7rem,2.5vw,1.1rem);font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 2px 6px #0007}
.pw span.me{box-shadow:0 0 0 3px #ffd60a,0 2px 6px #0007}
.pw span.mv{animation:hop .26s}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-40%) scale(1.2)}100%{transform:translateY(0)}}
.mid{grid-area:2/2/8/8;display:flex;flex-direction:column;justify-content:center;padding:10px 12px;font-size:clamp(.7rem,1.9vw,1.15rem);overflow:hidden}
.board .mid{border:1px dashed var(--bd);border-radius:14px;background:transparent}
.b3{position:relative;aspect-ratio:4/3;width:100%;border:1px solid #b9985c;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#263e5b,#0a1422 75%);box-shadow:0 18px 45px #0005,inset 0 0 0 4px #d8b56a0d}
.hud{position:absolute;left:10px;top:10px;z-index:2;max-width:min(48%,340px);pointer-events:none}
.hud .mid{display:block;grid-area:auto;margin:0;padding:8px 12px;background:#0b1728df;border:1px solid #b9985c88;border-radius:12px;font-size:clamp(.75rem,1.3vw,.95rem);box-shadow:0 8px 20px #0004}
.hud .mid h2{font-size:1rem}
.b3p{aspect-ratio:5/4}.b3p .hud{max-width:64%}.hud .lg{font-size:.9em}
@keyframes revealCard{0%{opacity:0;transform:translateY(12px) rotateX(8deg) scale(.96)}100%{opacity:1;transform:none}}
@keyframes goldPulse{0%,100%{box-shadow:0 0 0 #d8b56a00}50%{box-shadow:0 0 24px #d8b56a33}}
.hero{border:1px solid #b9985c;background:radial-gradient(ellipse at top,#294260,#101d30 75%);border-radius:20px;padding:18px;margin:10px 0;box-shadow:0 14px 32px #0003}
.event-card{position:relative;overflow:hidden;border:1px solid #d8b56a;border-radius:18px;padding:16px;margin:12px 0;background:linear-gradient(135deg,#203b59,#101a2a 70%);animation:revealCard .45s ease-out;box-shadow:0 12px 30px #0004}
.event-card:after{content:"";position:absolute;right:-28px;top:-36px;width:110px;height:110px;border:1px solid #d8b56a55;border-radius:50%;box-shadow:0 0 0 12px #d8b56a08,0 0 0 24px #d8b56a05;pointer-events:none}
.event-card .eyebrow{font-size:.75rem;letter-spacing:.12em;color:#e8ca86;font-weight:700}
.mission{border:1px dashed #d8b56a99;border-radius:12px;padding:9px 12px;background:#d8b56a0c;margin-top:8px}
.t.start,.t.luck,.t.invest,.t.insure{color:#fff}
.victory{border:1px solid #e8cb82;background:radial-gradient(ellipse at top,#54472c,#17253a 70%);animation:goldPulse 2s infinite}
@media(max-width:520px){#app{padding:9px}.board{gap:3px;padding:6px;border-radius:14px}.t{border-radius:6px}.card{padding:12px}.b3p{aspect-ratio:4/3}.row{gap:6px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.fxs{position:absolute;inset:0;display:grid;place-items:center;animation:fxin .25s both;transition:opacity .4s}.fxs.out{opacity:0}
@keyframes fxin{from{opacity:0}to{opacity:1}}
.shk{animation:shk .6s}@keyframes shk{10%,50%,90%{transform:translate(-10px,4px) rotate(-.6deg)}30%,70%{transform:translate(10px,-4px) rotate(.6deg)}}
.fxbg{position:absolute;inset:0}
.fxbg.gold{background:radial-gradient(circle,#ffd86eaa,#d8a02044 45%,#0008 85%);animation:fxp .5s 6}
.fxbg.red{background:radial-gradient(circle,#0000 25%,#ff1f2fdd);animation:fxp .25s 10}
.fxbg.sir{animation:sir .5s infinite}
@keyframes sir{0%,100%{background:radial-gradient(ellipse at 0 50%,#ff2a3add,#000a 70%)}50%{background:radial-gradient(ellipse at 100% 50%,#2a7bffdd,#000a 70%)}}
.fxbg.dark{background:radial-gradient(circle,#000a,#000f)}.fxbg.blue{background:radial-gradient(circle,#1b2c6a99,#050a24f0)}.fxbg.vio{background:radial-gradient(circle,#7a4dff77,#0b0620ee)}
@keyframes fxp{50%{opacity:.4}}
.fxw{position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px}
.fxwho{font-size:1rem;color:#fff;background:#000a;border-radius:99px;padding:3px 16px;border:1px solid #fff4}
.fxt{font-size:clamp(1.7rem,7.5vw,3.6rem);font-weight:800;color:#fff;text-shadow:0 0 22px #000,0 4px 0 #0008;animation:pop .6s cubic-bezier(.2,1.8,.4,1) both}
.fxt:empty{display:none}
.fxn{font-size:clamp(2.6rem,13vw,6.2rem);font-weight:900;line-height:1.1;background:linear-gradient(#fff6c8,#ffc933 55%,#e28b00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b3a00) drop-shadow(0 0 22px #ffb300);animation:pop .6s .2s cubic-bezier(.2,1.8,.4,1) both}
.fxn.neg{background-image:linear-gradient(#ffd6d6,#ff4d4d 55%,#a00000);filter:drop-shadow(0 4px 0 #400) drop-shadow(0 0 22px #f00)}
.fxbig{font-size:clamp(5rem,26vw,10rem);line-height:1;animation:slam .7s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 30px #ffd34e)}
@keyframes pop{from{transform:scale(0) rotate(-8deg)}to{transform:none}}
@keyframes slam{0%{transform:scale(4);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.sway{animation:slam .7s both,sway 1.2s .7s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.rew{animation:slam .6s both,rewf .5s .6s linear infinite}@keyframes rewf{50%{transform:translateX(-16px)}}
.fl{position:absolute;top:-12%;animation:fall linear forwards;will-change:transform}
@keyframes fall{to{transform:translateY(118vh) rotate(var(--r,0deg))}}
.fl.up{top:auto;bottom:-10%;animation-name:rise}@keyframes rise{to{transform:translateY(-118vh) rotate(var(--r,0deg))}}
.bu{position:absolute;animation:bu 1.4s ease-out forwards}.sp{position:absolute;width:7px;height:7px;border-radius:50%;animation:bu 1.5s ease-out forwards}
@keyframes bu{to{transform:translate(var(--x),var(--y)) rotate(var(--r,0deg)) scale(.5);opacity:0}}
.cf{position:absolute;top:-5%;width:10px;height:16px;animation:fall linear forwards}
.fxflash{position:absolute;inset:0;background:#fff;animation:fls .5s forwards}@keyframes fls{from{opacity:.95}to{opacity:0}}
.road{position:absolute;left:0;right:0;bottom:10%;height:20%;background:linear-gradient(#2a3347,#0b1020);border-top:4px solid #ffd34e99;overflow:hidden}
.road:after{content:"";position:absolute;left:0;right:0;top:48%;height:6px;background:repeating-linear-gradient(90deg,#fff 0 50px,#0000 50px 100px);animation:rd .4s linear infinite}@keyframes rd{to{background-position:-100px 0}}
.amb{position:absolute;left:-60%;bottom:15%;width:min(80vw,460px);z-index:2;animation:drive 3.2s cubic-bezier(.25,.6,.5,1) forwards}
@keyframes drive{to{left:105%}}
.amb svg{width:100%;filter:drop-shadow(0 12px 14px #000a);animation:bobv .22s infinite alternate}@keyframes bobv{to{transform:translateY(-4px) rotate(-.7deg)}}
.lt1{fill:#ff2a3a;animation:bl .3s infinite}.lt2{fill:#2a7bff;animation:bl .3s infinite .15s}@keyframes bl{50%{opacity:.15}}
.wh{transform-box:fill-box;transform-origin:center;animation:spinr .35s linear infinite}@keyframes spinr{to{transform:rotate(360deg)}}
.bill{font-size:clamp(1rem,4.5vw,1.5rem);color:#fff;font-weight:700;background:#000b;border-radius:10px;padding:4px 14px}.bill.ok{color:#77e2b5}.bill.bad{color:#ff9a9a}
.ecg{width:min(80vw,420px);filter:drop-shadow(0 0 8px #3f8)}.ecg polyline{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-1}}
.swirl{position:absolute;inset:-60%;background:conic-gradient(#a99cff66,#0000,#a99cff66,#0000,#a99cff66,#0000);animation:spinr 1.2s linear infinite reverse}
.ring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:6px solid #b3a0ff;border-radius:50%;animation:rg 1.2s .3s ease-out infinite}.ring.r2{animation-delay:.8s;border-color:#7dd3ff}@keyframes rg{to{transform:scale(30);opacity:0}}
.chart{position:absolute;left:8%;bottom:10%;width:84%;height:42%;z-index:1;filter:drop-shadow(0 0 10px #3f8)}.chart polyline{stroke:#7dffb0;stroke-width:6;fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dash2 1.6s .2s forwards}@keyframes dash2{to{stroke-dashoffset:0}}
.rkt{position:absolute;left:50%;top:50%;font-size:4.5rem;z-index:2;animation:fly 2.2s .2s ease-in both}@keyframes fly{from{transform:translate(-45vw,45vh) scale(.6)}to{transform:translate(45vw,-60vh) scale(1.7)}}
.gh{position:absolute;font-size:6rem;top:12%;left:-20%;z-index:2;animation:ghf 2.4s ease-in-out forwards;filter:drop-shadow(0 0 20px #a9f)}@keyframes ghf{50%{transform:rotate(12deg) translateY(40px)}to{left:110%}}
.stamp{border:8px solid #ff3b3b;color:#ff3b3b;font-size:clamp(2.2rem,11vw,5rem);font-weight:900;padding:6px 26px;border-radius:14px;transform:rotate(-12deg);animation:slam .5s both;background:#000a;text-shadow:0 0 18px #f00}
.reels{display:flex;gap:8px}.reels b{font-size:clamp(2.6rem,13vw,5rem);background:#fff;border:4px solid #d8b56a;border-radius:14px;padding:0 8px;box-shadow:0 0 30px #ffd34e}.reels b.hit{animation:slam .4s both;background:#fff4c0}
.fxcard{width:min(82vw,340px);padding:20px;border-radius:24px;background:linear-gradient(145deg,#2a4a72,#101c30);border:3px solid #ffd34e;color:#fff;box-shadow:0 0 70px #ffd34e99;animation:flip .8s both;display:flex;flex-direction:column;align-items:center}
.fxcard.bad{border-color:#ff4d4d;box-shadow:0 0 70px #ff2a2a99}.fxcard .eb{font-size:.8rem;letter-spacing:.14em;color:#e8ca86}
@keyframes flip{from{transform:perspective(800px) rotateY(180deg) scale(.2);opacity:0}to{transform:perspective(800px) rotateY(0) scale(1)}}
.fxs2{color:#fff;background:#000a;border-radius:10px;padding:4px 14px}
/* ===== LAYOUT: บอร์ด + รายละเอียด อยู่หน้าเดียว ไม่ต้องเลื่อน ===== */
body.gv{height:100dvh;overflow:hidden}
body.gv #app{max-width:none;height:100dvh;padding:8px;display:flex;flex-direction:column;overflow:hidden}
body.gv h1{font-size:1.15rem;margin:0}body.gv h2{font-size:1.05rem}
.hh{flex:none;margin-bottom:6px}.hh button{padding:7px 12px;margin:0 0 0 6px;font-size:.85rem}
body.gv .wrap{flex:1;min-height:0;gap:8px;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}
body.gv .wrap>*{min-height:0}
body.gv .b3{aspect-ratio:auto;height:100%;width:100%}
.side{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;scrollbar-width:none}.side::-webkit-scrollbar,.pl::-webkit-scrollbar{display:none}
.side .card{margin:0;padding:9px}.side .mid{flex:none;padding:8px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.plist .card{font-size:.85rem}.plist .mission .mut{display:none}.plist .mission{padding:4px 8px;margin-top:4px}
@media(max-width:899px){body.gv .wrap{grid-template-columns:1fr;grid-template-rows:minmax(0,1.3fr) minmax(0,1fr)}}
.pg{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
body.gv .b3p{aspect-ratio:auto;flex:1 1 0;min-height:130px;height:auto}
.pl{flex:none;max-height:60%;overflow:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.pl .card{margin:0;padding:10px}.pl .big{font-size:1.7rem;line-height:1.1}
.pl .card button{padding:11px 14px!important;font-size:1.1rem!important;margin:3px 4px 3px 0}
.pl .mission{padding:5px 9px;margin-top:4px;font-size:.85rem}
.pg.pe .b3p{flex:0 0 30%}.pg.pe .pl{flex:1;max-height:none}
@media(orientation:landscape) and (min-width:640px){.pg{flex-direction:row}body.gv .pg .b3p,body.gv .pg.pe .b3p{flex:1.4 1 0;min-height:0}.pl,.pg.pe .pl{flex:1 1 0;max-height:none;min-width:280px}}
body.pv #snd{top:calc(env(safe-area-inset-top,0px) + 10px)!important;bottom:auto!important;padding:4px 8px!important}
body.hv #snd{padding:4px 8px!important}
body.gv .hud{max-width:60%}.hud .event-card .mut{display:none}.hud .event-card{padding:4px 8px!important}
.t.start{--c:#c8921c}.t.luck{--c:#0c7c5b}.t.bad{--c:#a3162f}.t.skip{--c:#3d4c6b}.t.back{--c:#3b3f9e}.t.invest{--c:#1b4fc4}.t.insure{--c:#5a2fb2}.t.accident{--c:#b85a0a}.t.illness{--c:#a8244f}.t{border-width:1.5px;border-color:#d8b56acc;box-shadow:inset 0 1px #fff4,0 0 0 1px #0006,0 3px 8px #0006}#jobr{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 38%,var(--jc,#3b2a78),#04081c 78%);color:#fff;overflow:hidden;transition:background .3s}
.jr-rays{position:absolute;inset:-50%;background:repeating-conic-gradient(#ffffff16 0 8deg,#0000 8deg 16deg);animation:spinr 9s linear infinite;pointer-events:none}
.jr-top{position:relative;font-size:1.1rem;font-weight:700;letter-spacing:.06em;text-shadow:0 0 14px #000}
.jr-stage{position:relative;width:min(80vw,330px);height:min(46vh,380px);perspective:900px;display:grid;place-items:center}
.jr-plat{position:absolute;bottom:1%;width:92%;height:16%;border-radius:50%;background:radial-gradient(ellipse,#fff6,#0000 70%);border:3px solid #ffffff66;box-shadow:0 0 40px var(--jc,#fff),inset 0 0 30px #fff5}
.jr-char{position:relative;width:62%;transform-style:preserve-3d;animation:jrspin .6s linear infinite;filter:drop-shadow(0 10px 18px #000a)}
.jr-char.done{animation:jrland 1s cubic-bezier(.2,1.5,.4,1) forwards;filter:drop-shadow(0 0 26px var(--jc)) drop-shadow(0 10px 18px #000a)}
@keyframes jrspin{to{transform:rotateY(360deg)}}@keyframes jrland{from{transform:rotateY(360deg) scale(.6)}to{transform:rotateY(720deg) scale(1.12)}}
.jr-gear{position:absolute;left:50%;top:46%;margin:-1.3rem;font-size:2.4rem;font-style:normal;filter:drop-shadow(0 0 10px #fff);animation:gin .4s var(--d) both,orb 5s linear infinite;pointer-events:none}
@keyframes gin{from{opacity:0;scale:0}to{opacity:1;scale:1}}
@keyframes orb{from{transform:rotate(var(--a)) translateX(min(36vw,150px)) rotate(calc(-1*var(--a)))}to{transform:rotate(calc(var(--a) + 360deg)) translateX(min(36vw,150px)) rotate(calc(-1*(var(--a) + 360deg)))}}
.jr-rar{position:relative;font-weight:900;letter-spacing:.2em;font-size:1rem;min-height:1.4em;text-shadow:0 0 16px currentColor}
.jr-name{position:relative;font-size:clamp(1.7rem,8.5vw,2.8rem);font-weight:900;text-align:center;padding:0 10px;text-shadow:0 3px 0 #0008}
.jr-name.gold{background:linear-gradient(#fff6c8,#ffc933 55%,#e28b00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #6b3a00) drop-shadow(0 0 18px #ffb300)}
.jr-cash{position:relative;font-size:1.4rem;font-weight:800;color:#ffe9a8}
.pop{animation:slam .7s cubic-bezier(.2,1.6,.4,1) both}
#jobr button{position:relative;z-index:5;margin-top:6px;padding:14px 34px;font-size:1.2rem;animation:slam .6s both}

const holdVal=(h,g)=>{let v=h.s;for(let r=h.r+1;r<=rdOf(g);r++)v*=1+RT[(g.mk&&g.mk[r-1])||'flat'][h.k];return v};
const invVal=(p,g=G)=>(p.hold||[]).reduce((a,h)=>a+holdVal(h,g),0);
const invCost=p=>(p.hold||[]).reduce((a,h)=>a+h.s,0);
const svVal=(p,g=G)=>p.ins.includes('sv')?(p.svP||0)*(0.9+0.06*Math.max(0,rdOf(g)-(p.svR||1))):0;
const net=(p,g=G)=>p.cash+invVal(p,g)+svVal(p,g)-(p.debt||0);
const MISSIONS=[
 {id:'cash',title:'เงินสำรองแน่นปึ้ก',desc:'จบเกมด้วยเงินสดมากกว่าเงินเริ่มต้นของอาชีพ ฿10,000',test:p=>p.cash>=(p.start||50000)+10000},
 {id:'protect',title:'วางแผนคุ้มครอง',desc:'มีกรมธรรม์อย่างน้อย 2 ประเภท',test:p=>p.ins.length>=2},
 {id:'invest',title:'นักลงทุนตัวจริง',desc:'มีเงินลงทุนอย่างน้อย 1 รายการ',test:p=>(p.hold||[]).length>=1},
 {id:'lap',title:'นักวางแผนระยะยาว',desc:'ผ่านจุดเริ่มต้นอย่างน้อย 3 รอบ',test:p=>(p.lap||0)>=3},
 {id:'balance',title:'สมดุลการเงิน',desc:'จบเกมโดยไม่มีหนี้คงเหลือ',test:p=>(p.debt||0)===0}
];
const missionOf=p=>MISSIONS.find(m=>m.id===(p.mission||'cash'))||MISSIONS[0];
const missionDone=p=>missionOf(p).test(p);
const score=(p,g=G)=>net(p,g)+1000*p.ins.length+(missionDone(p)?8000:0);
const part=()=>G.order&&G.phase!='lobby'?ids().filter(i=>G.order.includes(i)):ids();
const rank=()=>part().sort((a,b)=>(b==G.winner)-(a==G.winner)||(P[b].st=='ok')-(P[a].st=='ok')||score(P[b])-score(P[a]));
const chips=p=>(p.ins.map(k=>`<span class="chip">🛡️${INS[k]} ${k=='sv'?f(svVal(p)):f((p.cov||{})[k]||0)}</span>`).join('')||'<span class="chip">ไม่มีประกัน</span>')+((p.hold||[]).length?`<span class="chip">📈 ลงทุน ${f(invVal(p))}</span>`:'')+((p.debt||0)>0?`<span class="chip" style="border-color:var(--loss);color:var(--loss)">หนี้ ${f(p.debt)}</span>`:'');
const ST={ok:'',dead:'💀 เสียชีวิต',broke:'💸 ล้มละลาย'};
const isTurn=()=>G.phase=='play'&&G.order&&G.order[G.turn]==uid;
const pick=p=>({pos:p.pos,cash:p.cash,ins:p.ins,st:p.st,skip:p.skip,cov:p.cov,lap:p.lap||0,debt:p.debt||0,hold:p.hold||[],svP:p.svP||0,svR:p.svR||0,mission:p.mission||"cash",via:p.via==null?null:p.via,mvid:Date.now()});

const SV=6000;
function surr(p){let m='';
 if(p.cash<0&&(p.hold||[]).length){const v=Math.round(invVal(p));p.cash+=v;p.hold=[];m+=' ขายหน่วยลงทุน +'+f(v)}
 if(p.cash<0&&p.ins.includes('sv')){const v=Math.round(svVal(p));p.cash+=v;p.ins=p.ins.filter(x=>x!='sv');m+=' เวนคืนประกันสะสมทรัพย์ +'+f(v)}
 if(p.cash<0&&p.ins.includes('life')){p.ins=p.ins.filter(x=>x!='life');p.cash+=SV;m+=' ใช้มูลค่าเวนคืนประกันชีวิต +'+f(SV)+' กรมธรรม์สิ้นสุด'}
 return m}
function eff(p,t){let m='',v;
 if(t=='luck'){v=1000*(1+rnd(3));p.cash+=v;m='+'+f(v)}
 else if(t=='bad'){v=1000*(1+rnd(3));p.cash-=v;m='-'+f(v)}
 else if(t=='skip'){p.skip=1;m='พัก 1 ตา'}
 else if(t=='back'){p.via=p.pos;p.pos=(p.pos+25)%28;m='ถอยหลัง 3 ช่อง'}
 else if(t=='accident'||t=='illness'){const ill=t=='illness',k=ill?'hl':'acc';v=ill?4000+2000*rnd(4):2000+1500*rnd(4);let pay=0;
  if(p.ins.includes(k)){pay=Math.min(v,p.cov[k]||0);p.cov[k]=(p.cov[k]||0)-pay;if(p.cov[k]<=0)p.ins=p.ins.filter(x=>x!=k)}
  const o=v-pay;m=(ill?'เจ็บป่วย ':'อุบัติเหตุ ')+'ค่ารักษา '+f(v)+(pay?' ประกันจ่าย '+f(pay):'')+' จ่ายเอง '+f(o);
  if(ill&&p.cash<o){if(p.ins.includes('life')){p.ins=p.ins.filter(x=>x!='life');p.cash=CV.life;return 'เสียชีวิต! ประกันชีวิตจ่ายทุน '+f(CV.life)+' กลับมาเริ่มใหม่'}
   p.st='dead';return 'ไม่มีเงินค่ารักษา เสียชีวิต 💀'}
  p.cash-=o}
 if(p.cash<0)m+=surr(p);if(p.cash<0&&p.st=='ok'){p.st='broke';m+=' ล้มละลาย 💸'}
 return m}

 do{t++;if(t>=o.length){t=0;r++}}while(alive.length&&!(P[o[t]]&&P[o[t]].st=='ok'));
 const win=P[uid].st=='ok'&&net(P[uid])>=GOAL;
 if(!alive.length||(alive.length<=1&&G.n0>1)||r>G.max||(G.n0>3&&alive.length<=3)||win)phase='end';
 await db.doc('game/main').update({turn:t,round:r,phase,...(win?{winner:uid}:{}),log:[msg+(win?' 🏆 ถึงเป้าหมายความมั่งคั่ง!':''),...(G.log||[])].slice(0,8),...(G.event?{event:G.event}:{})});

 const p={...P[uid],ins:[...P[uid].ins],cov:{...(P[uid].cov||{})},hold:[...(P[uid].hold||[])]},d=1+rnd(6);

 p.pos=(p.pos+d)%28;p.via=null;const t=T[p.pos];
 if(t=='invest'||t=='insure'){m+=' → '+M[t][1]+' ';P[uid]=p;await db.doc('players/'+uid).update({pos:p.pos,cash:p.cash,lap:p.lap||0,debt:p.debt||0,via:null,mvid:Date.now()});await db.doc('game/main').update({log:[m,...(G.log||[])].slice(0,8)});choice={t,m};busy=false;render();return}
 /* หนึ่งตา = หนึ่งเหตุการณ์ */
 if(d===6){const jp=2000+1000*rnd(4);p.cash+=jp;m+=' 🎰 แจ็กพอตลูกเต๋า +'+f(jp)}
 else if((t=='luck'||t=='bad')&&rnd(100)<32){
   const cards=[
    {title:'โบนัสพิเศษ',desc:'ผลงานโดดเด่น ได้รับโบนัส',v:5000,icon:'✨'},
    {title:'ค่าซ่อมฉุกเฉิน',desc:'ทรัพย์สินต้องซ่อมแซม',v:-3500,icon:'🧰'},
    {title:'โอกาสงานพิเศษ',desc:'รับงานเพิ่ม ได้รายได้ก้อนพิเศษ',v:4000,icon:'💼'},
    {title:'ตลาดผันผวน',desc:'ตลาดเปลี่ยนแปลง ทำให้มีค่าใช้จ่ายเพิ่ม',v:-2500,icon:'📉'},
    {title:'เงินคืนภาษี',desc:'ได้รับเงินคืนจากการวางแผนที่ดี',v:2500,icon:'🏦'},
    {title:'ช่วยเหลือครอบครัว',desc:'แบ่งปันเงินช่วยเหลือคนสำคัญ',v:-2000,icon:'💗'}
   ];
   const ec=cards[rnd(cards.length)];p.cash+=ec.v;
   m+=` 🎴 ${ec.icon} การ์ดเหตุการณ์: ${ec.title} ${ec.v>=0?'+':'−'}฿${f(Math.abs(ec.v))}`;
   G.event={...ec,amount:ec.v,player:p.name,stamp:Date.now()};
   if(p.cash<0)m+=surr(p);
   if(p.cash<0&&p.st=='ok'){p.st='broke';m+=' ล้มละลาย 💸'}
  }
 else{m+=' → '+M[t][1]+' ';m+=eff(p,t)}
  await fin(pick(p),m)}

const podium=()=>{const R=rank(),W=G.winner;
 const best=fn=>{let b=null,v=0;R.forEach(id=>{const x=P[id].st=='ok'?fn(P[id]):0;if(x>v){v=x;b=id}});return b?[b,v]:null};
 const ig=best(p=>invVal(p)-invCost(p)),sv=best(svVal),pr=best(p=>p.ins.length);
 const aw=[R[0]?['🏆','วางแผนดีเยี่ยม',R[0],'คะแนน ฿'+f(score(P[R[0]]))]:null,ig?['📈','นักลงทุนยอดเยี่ยม',ig[0],'กำไรลงทุน +'+f(ig[1])]:null,sv?['🏦','นักออมยอดเยี่ยม',sv[0],'ประกันสะสมทรัพย์ ฿'+f(sv[1])]:null,pr?['🛡️','คุ้มครองรอบด้าน',pr[0],pr[1]+' กรมธรรม์']:null].filter(Boolean);

function tone(f,t0,d,ty,v,f2){const a=au();if(!a||!SND)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(t0,d,v,fc){const a=au();if(!a||!SND)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
 for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;
 const g=a.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}

 const list=part().map(id=>{const p=P[id],o=p.st!='ok',J=JB(p.job),ic=cur&&G.order[G.turn]==id;
  return `<div class="ph2 ${o?'out':'lv'+lv(p)} ${ic?'cur':''}" style="--pc:${col(id)}"><div class="ph2-rk">${['🥇','🥈','🥉'][RK[id]-1]||'#'+RK[id]}</div><div class="ph2-port">${J?charSVG(J):''}</div><div class="ph2-main"><div class="ph2-nm">${ic?'▶ ':''}${esc(p.name)} ${J?J.ic:''}</div><div class="h2-cash sm">🪙 <b data-v="${p.cash}" data-k="${id}">฿${f(p.cash)}</b></div><div class="h2-bar sm"><i style="width:${Math.max(2,Math.min(100,net(p)/GOAL*100))}%"></i></div><div>${o?ST[p.st]+' (ผี 👻)':chips(p)}</div></div></div>`}).join('');
 return `<div class="row hh"><div><h1>เกมวางแผนชีวิต</h1><div class="mut">ห้อง <b>${room}</b></div></div><div>${G.phase!='play'&&G.phase!='end'?`<button onclick="start()" ${ids().length<2?'disabled':''}>เริ่มเกม (${ids().length} คน)</button>`:''}<button class="g" onclick="reset()">${arm?'กดอีกครั้งเพื่อยืนยัน':'รีเซ็ต'}</button></div></div>
 <div class="wrap">${typeof THREE!='undefined'?`<div class="b3" id="b3slot"></div>`:`<div class="board">${cells}${mid}</div>`}<div class="side">${G.phase=='end'?podium():`${typeof THREE!='undefined'?mid:''}${G.phase=='lobby'?qr():''}<div class="plist">${list}</div><div class="mut" style="font-size:.8rem">🟢 ปลอดภัย 🟡 เฝ้าระวัง 🟠 อันตราย 🔴 วิกฤต</div>`}</div></div>`}

function play(){const p=P[uid];
 if(p&&G.phase!='lobby'&&G.order&&!G.order.includes(uid))return '<div class="card"><h3>เกมเริ่มไปแล้ว</h3><div class="mut">คุณเข้าห้องไม่ทัน รอเล่นรอบหน้านะ</div></div>';
 if(!p)return `<h2>เข้าร่วมเกม</h2>${G.phase=='lobby'?`<input id="nm" placeholder="ชื่อของคุณ" maxlength="12" value="${esc(Q.get('name')||'')}"><button onclick="join()">เข้าห้อง</button>`:'<div class="card">เกมเริ่มไปแล้ว รอรอบหน้านะ</div>'}`;
 const out=p.st!='ok',tl=T[p.pos];
 let act='';
 if(G.phase=='end')act=podium()+finalBtn();
 else if(out)act=`<div class="card"><h3>${ST[p.st]}</h3><div class="mut">คุณเป็นผีแล้ว ป่วนผู้เล่นที่ยังอยู่ได้ ${p.ghost} ครั้ง</div><button onclick="haunt()" ${p.ghost<1||busy?'disabled':''}>👻 ปล่อยข่าวร้าย (-1,000)</button></div>`;
 else if(G.phase=='lobby'){const J=JB(p.job),fr=ids().filter(i=>i!=uid);act=`<div class="card" style="padding:8px;text-align:center">${pcard(uid,{w:1})}<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px">${fr.map(i=>`<span class="chip2">${P[i].rv===false?'🎲 ':jIc(P[i])}${esc(P[i].name)}</span>`).join('')||'<span class="mut">ยังไม่มีเพื่อนในห้อง</span>'}</div><div class="dots mut">👥 ในห้อง ${ids().length} คน · รอผู้ควบคุมเริ่มเกม<i>.</i><i>.</i><i>.</i></div>${J?`<button class="g" onclick="jobRoulette(JB('${J.id}'))">✨ ดูชุดอาชีพอีกครั้ง</button>`:''}</div>`}
 else if(isTurn()){
  if(choice&&choice.t=='invest')act=`<div class="card"><h3>📈 ลงทุน ${f(STK)}</h3>${mbanner()}<div class="mut">ผลตอบแทนต่อรอบ (ตามสภาพตลาด)<br>เสี่ยงต่ำ: ▲ +10% · ▬ +3% · ▼ -4%<br>เสี่ยงสูง: ▲ +30% · ▬ +5% · ▼ -25%</div><button onclick="inv('lo')" ${p.cash<STK?'disabled':''}>เสี่ยงต่ำ</button><button onclick="inv('hi')" ${p.cash<STK?'disabled':''}>เสี่ยงสูง</button><button class="g" onclick="inv('no')">ข้าม</button></div>`;
  else if(choice)act=`<div class="card"><h3>🛡️ ซื้อประกัน</h3><div class="mut">สุขภาพ/อุบัติเหตุ จ่ายค่ารักษาตามวงเงิน · ชีวิต จ่ายทุนเมื่อเสียชีวิต</div>${Object.keys(PR).filter(k=>!p.ins.includes(k)).map(k=>`<button onclick="buy('${k}')" ${p.cash<PR[k]?'disabled':''}>${INS[k]} ฿${f(PR[k])}<br><small>${k=='sv'?'มูลค่าเพิ่มทุกรอบ':'คุ้มครอง '+f(CV[k])}</small></button>`).join('')}<button class="g" onclick="buy('no')">ไม่ซื้อ</button></div>`;
  else if(p.skip>0)act=`<div class="card"><h3>⏸️ ติดพัก</h3><button onclick="skipT()" ${busy?'disabled':''}>ข้ามตานี้</button></div>`;
  else act=`<div class="card"><div class="myt">⚡ ตาของคุณ! ⚡</div><button class="roll" onclick="roll()" ${busy?'disabled':''}>${busy?'🎲 กำลังทอย…':'🎲 ทอยลูกเต๋า'}</button>${p.cash<3000&&!(p.debt>0)?`<button class="g" style="width:100%" onclick="loan()" ${busy?'disabled':''}>🏦 กู้สถาบันการเงิน รับ 8,000 (คืน 10,000)</button><div class="mut">เงินใกล้หมดกู้ได้ 1 ครั้ง หักคืนจากโบนัสผ่านรอบ</div>`:''}</div>`}
 else{const cq=P[G.order[G.turn]]||{},cj=JB(cq.job);act=`<div class="wait2" style="--pc:${col(G.order[G.turn])}"><div class="wp">${cj?charSVG(cj):''}</div><div>รอ <b style="color:${col(G.order[G.turn])}">${esc(cq.name||'')}</b> เล่น<span class="dots"><i>.</i><i>.</i><i>.</i></span></div></div>`}
 const mi=missionOf(p);
  const ev=G.event&&G.event.stamp&&Date.now()-G.event.stamp<18000?`<div class="event-card"><div class="eyebrow">LIFE EVENT CARD</div><h2>${G.event.icon||'🎴'} ${esc(G.event.title||'การ์ดเหตุการณ์')}</h2><div>${esc(G.event.desc||'เหตุการณ์พิเศษในเกม')}</div><div class="big" style="font-size:1.65rem;color:${(G.event.amount||0)>=0?'#77e2b5':'#ff9a9a'}">${(G.event.amount||0)>=0?'+':'−'}฿${f(Math.abs(G.event.amount||0))}</div><div class="mut">ผู้ได้รับเหตุการณ์: ${esc(G.event.player||'ผู้เล่น')}</div></div>`:'';
  return `<div class="pg ${G.phase=='end'?'pe':''}">${typeof THREE!='undefined'?`<div class="b3 b3p" id="b3slot"></div>`:`<div class="board">${cellsHtml()}${mini()}</div>`}<div class="pl"><div class="hud2 ${out?'out':'lv'+lv(p)}" style="--pc:${col(uid)}"><div class="h2-port">${JB(p.job)?charSVG(JB(p.job)):'🙂'}</div><div class="h2-main"><div class="h2-name">${esc(p.name)}<small>${JB(p.job)?JB(p.job).ic+' '+JB(p.job).n:''}</small></div><div class="h2-cash">🪙 <b data-v="${p.cash}" data-k="me">฿${f(p.cash)}</b></div><div class="h2-bar"><i style="width:${Math.max(2,Math.min(100,net(p)/GOAL*100))}%"></i><span>${f(net(p))} / ${f(GOAL)}</span></div><div class="h2-sub">ช่อง ${M[tl][0]} ${M[tl][1]} · รอบ ${p.lap||0}</div></div></div><div class="h2-chips">${out?ST[p.st]:chips(p)}</div><div class="quest ${missionDone(p)?'ok':''}"><b>🎯 ${mi.title}</b>${missionDone(p)?'<em>✔ สำเร็จ +฿8,000</em>':''}<span>${mi.desc}</span></div>${act}</div></div>`}

function render(){if(P)sync();if(document.activeElement&&document.activeElement.tagName=='INPUT')return;
 if(!room){$.innerHTML='<div class="hero"><div style="color:var(--gold);font-weight:700;letter-spacing:.12em">PREMIUM LIFE STRATEGY</div><h1>เกมวางแผนชีวิต</h1><div class="mut">ทอยเต๋า · วางแผน · รับมือเหตุการณ์ · สร้างความมั่งคั่ง</div></div><button style="width:100%;padding:24px" onclick="newRoom()">🖥️ สร้างห้อง (ผู้ควบคุม)</button><div class="card"><input id="rc" placeholder="รหัสห้อง 4 ตัวอักษร" maxlength="6"><button onclick="goRoom()">📱 เข้าห้อง (ผู้เล่น)</button></div><button class="g" style="width:100%" onclick="location.search=&quot;?admin=1&quot;">📊 ผู้ดูแลทุกห้อง</button>';return}
 if(!db){$.innerHTML='<div class="card">กำลังเชื่อมต่อ…</div>';return}
 document.body.className=(role=='host'?'gv hv':role=='player'?'gv pv':'')+(role=='player'&&G.phase=='play'&&P&&P[uid]&&isTurn()?' myturn':'');$.innerHTML=role==null?`<h1>เกมวางแผนชีวิต</h1><button style="width:100%;padding:24px" onclick="setRole('player')">📱 ผู้เล่น (มือถือ)</button><button class="g" style="width:100%;padding:24px" onclick="setRole('host')">🖥️ ผู้ควบคุม (คอม)</button>`:role=='host'?host():play();if(role)mount3d();animCash();{const mine=document.body.classList.contains('myturn');if(mine&&!wasMine){sfx('ding');try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}}wasMine=mine}}

(function(){if(Q.get('admin')){admin();return}if(!room){render();return}
 try{uid=localStorage.getItem('uid')}catch(e){}
 if(!uid){uid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));try{localStorage.setItem('uid',uid)}catch(e){}}
 db=mkDb(room);
 db.collection('players').onSnapshot(s=>{P={};s.docs.forEach(d=>P[d.id]=d.data());render()});
 let sg0,wasEnd=0;db.doc('game/main').onSnapshot(s=>{const n=s.exists?s.data():{phase:'lobby'};G=n;
  if(db.ready()){const sg=(n.log||[]).join('|');if(sg0===undefined){sg0=sg;wasEnd=n.phase=='end'}
   else{if(sg!==sg0){sg0=sg;if(n.log&&n.log[0])sfxLog(n.log[0])}if(n.phase=='end'&&!wasEnd)fxQ('win',{});wasEnd=n.phase=='end'}}
  render()});
 render()})();
